PPU-645f0573d7438e37ddd231377adf9c1205e8a040:
  "Unlimited Magic Use":
    Games:
      "God Of War: HD (Custom QoL)":
        BCUS98229: [ 01.01 ]
    Author: "Wulf2k; RPCS3 verification by Cedar17"
    Notes: "Verified working. The blue magic meter still drains normally and may reach zero, but Kratos can continue casting magic indefinitely. This patch removes the 'insufficient magic' restriction; it does NOT freeze or refill the visible blue meter."
    Patch Version: 1.0
    Patch:
      # Wulf2k AoB:
      #   7D6307B4 4E800020 89280411
      # ->38600001 4E800020 89280411
      #
      # 0x38600001 = li r3, 1
      # The following instruction is blr, so this tiny function immediately returns true.
      # In practice this bypasses the magic-availability check rather than changing the
      # numeric value displayed by the HUD.
      - [ be32, 0x00071E60, 0x38600001 ]

  "Infinite Mid-Air Jumps":
    Games:
      "God Of War: HD (Custom QoL)":
        BCUS98229: [ 01.01 ]
    Author: "Wulf2k; RPCS3 verification by Cedar17"
    Notes: "Verified working. After the normal first and second jump, X can be pressed repeatedly in mid-air for additional jumps. Useful for traversal and bypassing timing/platform hazards. Large sequence breaks may skip camera or gameplay trigger volumes."
    Patch Version: 1.0
    Patch:
      # Wulf2k AoB:
      #   60000018 540902D6
      # ->60000000 540902D6
      #
      # 0x60000000 is the canonical PowerPC NOP (ori r0,r0,0).
      # Replacing this instruction removes the limiter used by this jump path while leaving
      # the adjacent instruction untouched.
      - [ be32, 0x00080B14, 0x60000000 ]
